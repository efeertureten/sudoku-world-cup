name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sudoku
          POSTGRES_PASSWORD: sudoku
          POSTGRES_DB: sudoku_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sudoku"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://sudoku:sudoku@localhost:5432/sudoku_test
      TEST_REDIS_URL: redis://localhost:6379/5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  compose:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build the images
        run: |
          set -o pipefail
          docker compose build --progress plain 2>&1 | tee /tmp/compose-build.log
      - name: Start the full stack exactly as the README says
        run: docker compose up --detach --wait --wait-timeout 300
      - name: App, API and sign-up answer through Caddy
        run: |
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/api/v1/readyz
          curl -fsS -X POST http://localhost:8080/api/v1/auth/guest \
            -H 'content-type: application/json' \
            -d '{"username":"ci_smoke","countryCode":"TR"}' | grep -q '"username":"ci_smoke"'
          curl -fsS "http://localhost:8080/socket.io/?EIO=4&transport=polling" | grep -q '"sid"'
      - name: Show logs on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color
          # Also surface the tail as an annotation, so it is readable from the run summary and the API.
          {
            echo "== build (tail) =="; tail -n 60 /tmp/compose-build.log 2>/dev/null
            echo "== containers =="; docker compose ps --all
            echo "== logs (tail) =="; docker compose logs --no-color --tail 40
          } > /tmp/diagnostics.txt 2>&1
          msg=$(tail -c 60000 /tmp/diagnostics.txt | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Compose diagnostics::${msg}"
      - name: Tear down
        if: always()
        run: docker compose down --volumes
