# Infrastructure only, for local development with hot reload:
#   pnpm infra:up      # Postgres on :5432, Redis on :6379
#   pnpm dev           # server on :3000, web on :5173 (proxies /api and /socket.io)

name: sudoku-world-cup-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sudoku
      POSTGRES_PASSWORD: sudoku
      POSTGRES_DB: sudoku
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
      - ./infra/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sudoku"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"

volumes:
  postgres-dev-data:
